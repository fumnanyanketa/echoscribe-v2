[package]
name = "echoscribe"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "echoscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest-blocking", "rustls-tls"] }
tiny_http = "0.12"
open = "5"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    # AC-20: asking the focused element whether it is a password field.
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Variant",
] }
cpal = "0.18.2"
# Record 0002's New libraries table, approved with the decision. Deepgram's own
# Rust SDK, at version zero, so it is pinned exactly: the record warns to expect
# breaking changes between versions.
# Only `listen` is switched on. The crate also ships `manage`, which can create
# and delete API keys, and `speak`, which is text to speech. Neither belongs in
# this app, and code that is not compiled in cannot be reached by mistake.
deepgram = { version = "=0.10.0", default-features = false, features = ["listen"] }
# Required by the Deepgram SDK regardless. Only the pieces the stream needs.
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }


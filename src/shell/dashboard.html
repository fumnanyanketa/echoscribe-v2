<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <!-- The five screens the surface below holds: History, and one per
         sub-section of Settings, Dictation, Languages, Vocabulary and
         Transcription. Linked here rather than injected by any of them,
         because this page is the only one that mounts them. Each lives in its
         own feature's folder. -->
    <link rel="stylesheet" href="../history/history.css" />
    <link rel="stylesheet" href="../dictate/dictation-settings.css" />
    <link rel="stylesheet" href="../language/language.css" />
    <link rel="stylesheet" href="../vocabulary/vocabulary.css" />
    <link rel="stylesheet" href="../dictate/transcription-settings.css" />
    <title>EchoScribe</title>
    <script type="module" src="dashboard.js"></script>
  </head>
  <body class="dashboard-body">
    <!-- The two-tone shell: a persistent dark rail on the left where you
         navigate, a white surface on the right where you read
         (design/design-system.md, Composition; record 0004). Rust sizes and
         places the window before it is ever shown, and nothing on this page
         knows a coordinate. -->
    <div class="dashboard">
      <!-- Filled by rail.js from what get_rail() returned. A screen cannot add
           a destination: the list is a literal in Rust. -->
      <nav class="rail" id="rail"></nav>
      <!-- The white reading surface. dashboard.js mounts whichever screen the
           rail's chosen destination has, and empties it again on the way out.
           Every destination the rail hands out now has one, so record 0004's
           AC-2 holds for all six: History, and Settings with its Dictation,
           Languages, Vocabulary and Transcription sub-sections. Languages and
           Vocabulary joined on 2026-09-04, for records 0006 and 0005, and
           History the same day, for record 0007, which also made it the
           landing. None of the three was added to the rail before its screen
           existed. A destination with no screen would leave the surface empty,
           because design/registry.md draws no component for a surface waiting
           for its screen and a build may not invent one. -->
      <main class="surface" id="surface" tabindex="-1"></main>
    </div>
  </body>
</html>
